<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Drop Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-wrapper">
        <h1 class="game-title">⛈️ Rain Chaser ⛈️</h1>
        <p class="game-tagline">Click on the rain cloud to collect water! Avoid the sunny cloud!</p>
        <div class="score-panel">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="timer">Time: <span id="time">30</span>s</div>
            <button id="start-btn">Start Game</button>
        </div>

        <div class="message">
        </div>
        
        <div id="game-container">
          <div id="cloud">🌧️</div>
        </div>
    </div>
    
    <script src="script.js"></script>
    <footer>
      <div class="footer-content">
        <img src="img/logo.png" alt="Company Logo" min-width="100px" max-width="200px">
      </div>
    </footer>
  </body>



</html>
